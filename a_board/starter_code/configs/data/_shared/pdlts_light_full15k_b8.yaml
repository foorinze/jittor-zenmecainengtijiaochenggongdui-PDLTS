# A 榜 Light full15k data.
# 目的：对照 paired baseline 的 10k/epoch 概率流，改为每个 epoch 覆盖 train.txt 全量样本。
# 其余训练口径保持 paired baseline：batch=8、obj loader、同 validate datalist。

data_name: &data_name models/model_normalized.obj
loader: &loader obj

train_dataset:
  shuffle: True
  batch_size: 8
  num_workers: 8
  datapath:
    input_dataset_dir: ../dataset/train
    use_prob: False
    loader: *loader
    data_name: *data_name
    ignore_check: True
    data_path:
      shapenet: [
        [./datalist/train.txt, 1.0],
      ]

validate_dataset:
  shuffle: False
  batch_size: 1
  num_workers: 8
  datapath:
    input_dataset_dir: ../dataset/train
    use_prob: False
    loader: *loader
    data_name: *data_name
    ignore_check: True
    data_path:
      shapenet: [
        [./datalist/validate.txt, 1.0],
      ]
