# PDLTS Light official test_noisy predict data
# 199 个样本: dataset/test_noisy/shapenet/<cls>/<id>/noisy.npy

predict_dataset:
  shuffle: False
  batch_size: 1
  num_workers: 0
  datapath:
    input_dataset_dir: ../dataset/test_noisy
    use_prob: False
    loader: npy
    data_name: noisy.npy
    ignore_check: True
    data_path:
      shapenet: [
        [./datalist/test.txt, 1.0],
      ]
