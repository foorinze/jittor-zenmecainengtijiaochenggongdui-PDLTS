# B 榜官方测试集推理数据配置。
# 公开复现时，请把官方 test_noisy_b 数据放在 b_board/dataset/test_noisy_b/。

CONFIG_VERSION: b_final

predict_dataset:
  shuffle: False
  batch_size: 1
  num_workers: 0
  datapath:
    input_dataset_dir: ../dataset/test_noisy_b
    use_prob: False
    loader: npy
    data_name: noisy.npy
    ignore_check: True
    data_path:
      shapenet: [
        [./datalist/test_b.txt, 1.0],
      ]
