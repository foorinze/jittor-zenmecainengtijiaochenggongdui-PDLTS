# PDLTS Light official test_noisy predict data
# 200 个样本: dataset/test_noisy/shapenet/<cls>/<id>/noisy.npy
# （原注释写 199，系 wc -l 对无末换行 datalist 少数 1；真值 grep -c . = 200）

predict_dataset:
  shuffle: False
  batch_size: 1
  num_workers: 0
  datapath:
    input_dataset_dir: ../dataset/test_noisy
    use_prob: False
    loader: npy
    data_name: noisy.npy
    ignore_check: True
    data_path:
      shapenet: [
        [./datalist/test.txt, 1.0],
      ]
