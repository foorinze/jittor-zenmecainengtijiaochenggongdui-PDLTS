# PDLTS Light full 200 mock predict data
# 与 pdlts_light_mock.yaml 完全一致，只是 datalist 指向 mock_full.txt (200 样本)

predict_dataset:
  shuffle: False
  batch_size: 1
  num_workers: 0
  datapath:
    input_dataset_dir: ../dataset/mock_test
    use_prob: False
    loader: npy
    data_name: noisy.npy
    ignore_check: True
    data_path:
      shapenet: [
        [./datalist/mock_full.txt, 1.0],
      ]
